{% load ui %}
<a href="{% url 'core:dashboard:comptabilite-dashboard' %}" class="ua-nav-link {% if request.resolver_match.url_name == 'comptabilite-dashboard' %}is-active{% endif %}">
    {% icon "grid" %}<span>Tableau de bord</span>
</a>
<a href="{% url 'core:dashboard:journal' %}" class="ua-nav-link {% if request.resolver_match.url_name == 'journal' or request.resolver_match.url_name == 'transaction-detail' %}is-active{% endif %}">
    {% icon "file-text" %}<span>Journal comptable</span>
</a>
<a href="{% url 'core:dashboard:transaction-create' %}" class="ua-nav-link {% if request.resolver_match.url_name == 'transaction-create' %}is-active{% endif %}">
    {% icon "wallet" %}<span>Nouvelle opération</span>
</a>
<a href="{% url 'core:dashboard:payment-create' %}" class="ua-nav-link {% if request.resolver_match.url_name == 'payment-create' %}is-active{% endif %}">
    {% icon "credit-card" %}<span>Paiement étudiant</span>
</a>
<a href="{% url 'core:dashboard:accounts' %}" class="ua-nav-link {% if request.resolver_match.url_name == 'accounts' %}is-active{% endif %}">
    {% icon "wallet" %}<span>Caisses & comptes</span>
</a>
<a href="{% url 'core:dashboard:closures' %}" class="ua-nav-link {% if request.resolver_match.url_name == 'closures' or request.resolver_match.url_name == 'closure-create' %}is-active{% endif %}">
    {% icon "check-circle" %}<span>Clôtures</span>
</a>
