{% load i18n static %}<!DOCTYPE html>
{% get_current_language as LANGUAGE_CODE %}
<html lang="{{ LANGUAGE_CODE|default:'fr' }}" data-theme="light" data-theme-choice="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}{% trans "Univers Academy — plateforme de gestion académique" %}{% endblock %}">
    <title>{% block title %}Univers Academy{% endblock %}</title>

    <!-- Thème résolu avant la peinture : sans ce bloc, la page s'affiche claire
         puis bascule, ce qui fait clignoter tout le tableau de bord. -->
    <script>
<!--
        (function () {
            var choix = 'auto';
            try {
                var stocke = localStorage.getItem('ua-theme');
                if (stocke === 'light' || stocke === 'dark' || stocke === 'auto') choix = stocke;
            } catch (erreur) { /* stockage privé : on reste sur le thème système */ }

            function sombre(preference) {
                return preference === 'dark'
                    || (preference === 'auto'
                        && window.matchMedia('(prefers-color-scheme: dark)').matches);
            }

            var racine = document.documentElement;
            racine.dataset.theme = sombre(choix) ? 'dark' : 'light';
            racine.dataset.themeChoice = choix;

            window.uaThemeAppliquer = function (preference) {
                racine.dataset.theme = sombre(preference) ? 'dark' : 'light';
                racine.dataset.themeChoice = preference;
                try { localStorage.setItem('ua-theme', preference); } catch (erreur) {}
            };

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
                var preference = racine.dataset.themeChoice || 'auto';
                if (preference === 'auto') {
                    racine.dataset.theme = sombre('auto') ? 'dark' : 'light';
                }
            });
        })();
//-->
    </script>

    <!-- Tailwind CSS compilé -->
    <link href="{% static 'css/output.css' %}" rel="stylesheet">

    <!-- Polices modernes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style><!--
        /* Police globale */
        html {
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            font-feature-settings: 'cv11', 'ss01';
        }

        /* Scrollbar moderne */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--ua-surface-scroll);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--ua-surface-scroll-hover);
        }

        /* Animations utilitaires */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-in-right {
            animation: slideInRight 0.3s ease-out;
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Focus visible pour l'accessibilité */
        *:focus-visible {
            outline: 2px solid var(--ua-brand);
            outline-offset: 2px;
            border-radius: 4px;
        }

        /* Smooth scroll */
        html {
            scroll-behavior: smooth;
        }

        /* Empêcher le flash de contenu non stylé */
        .no-flash {
            opacity: 1 !important;
        }
    --></style>

    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen">
    {% block body %}{% endblock %}

    {% block extra_scripts %}{% endblock %}
</body>
</html>
